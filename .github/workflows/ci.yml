name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security validation
        run: |
          if [ -f hooks/validate_security.py ]; then
            python3 hooks/validate_security.py .
          else
            echo "Security hook not found, skipping"
          fi

      - name: Validate SKILL.md files
        run: |
          missing=0
          for skill in skills/*/; do
            name=$(basename "$skill")
            if [ ! -f "${skill}SKILL.md" ]; then
              echo "❌ $name: missing SKILL.md"
              missing=$((missing + 1))
            else
              echo "✓ $name"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Validate registry.json
        run: |
          if [ -f skills/registry.json ]; then
            python3 -m json.tool skills/registry.json > /dev/null && echo "✓ registry.json is valid JSON"
          fi

      - name: Check skill registry sync
        run: |
          python3 -c "
import json
with open('skills/registry.json') as f:
    reg = json.load(f)
skills_in_reg = set(reg['skills'].keys())
skills_on_disk = {d.name for d in __import__('os').scandir('skills') if d.is_dir() and 'SKILL.md' in [f.name for f in __import__('os').scandir(d.path)]}
print(f'Skills in registry: {len(skills_in_reg)}')
print(f'Skills on disk: {len(skills_on_disk)}')
missing_in_reg = skills_on_disk - skills_in_reg
missing_on_disk = skills_in_reg - skills_on_disk
if missing_in_reg:
    print(f'⚠️  Not in registry: {missing_in_reg}')
if missing_on_disk:
    print(f'⚠️  Missing SKILL.md: {missing_on_disk}')
if missing_in_reg or missing_on_disk:
    exit(1)
"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AGENTS.md structure
        run: |
          [ -f AGENTS.md ] && echo "✓ AGENTS.md exists" || (echo "❌ AGENTS.md missing"; exit 1)
          [ -f README.md ] && echo "✓ README.md exists" || (echo "❌ README.md missing"; exit 1)
          [ -f LICENSE ] && echo "✓ LICENSE exists" || (echo "⚠️  LICENSE missing")

      - name: Check for hardcoded secrets (sanity check)
        run: |
          grep -rn "sk-[a-zA-Z0-9]\{20,\}" agents/ skills/ rules/ --include="*.md" 2>/dev/null && { echo "❌ Found potential secrets in markdown"; exit 1; } || echo "✓ No secrets detected"
